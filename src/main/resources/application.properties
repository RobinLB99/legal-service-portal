# ------------------------------------------------------
# Configuración esencial para desarrollo (MEJORADA)
# ------------------------------------------------------

# Nombre y puerto (bien)
spring.application.name=LegalServicePortal
server.port=8080

# Perfil activo (bien)
spring.profiles.active=dev

# ------------------------------------------------------
# Base de Datos (seguridad mejorada)
# ------------------------------------------------------
spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# Valores por defecto para desarrollo local

# ------------------------------------------------------
# JPA/Hibernate (optimizado para dev)
# ------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Importante para evitar LazyInitializationException
spring.jpa.open-in-view=false

# Naming strategies (bien)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# ------------------------------------------------------
# Thymeleaf (bien)
# ------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ------------------------------------------------------
# Logging (mejorado)
# ------------------------------------------------------
# Console (colorido)
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx

# Niveles específicos (recomendado)
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
# Muestra parámetros SQL
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE 
logging.level.com.robinlb99.legalserviceportal=DEBUG
# Evita spam de librerías
logging.level.root=INFO

# ------------------------------------------------------
# Seguridad Adicional para Dev
# ------------------------------------------------------
# Exponer endpoints de actuator (útil para desarrollo)
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always

# Deshabilitar protecciones CSRF en desarrollo
spring.security.csrf.disabled=true

# ------------------------------------------------------
# Otras configuraciones útiles
# ------------------------------------------------------
# Para ver autoconfiguration report
debug=true

# Tamaño máximo de archivos de carga
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Mostrar errores completos en respuestas
server.error.include-stacktrace=always
server.error.include-message=always

# ------------------------------------------------------
# Configuración de DevTools para Docker
# ------------------------------------------------------
spring.devtools.livereload.enabled=true
# Forzar el sondeo (polling) para detectar cambios a través de volúmenes de Docker
spring.devtools.restart.poll-interval=2s
# Tiempo de espera tras un cambio antes de reiniciar (evita reinicios múltiples)
spring.devtools.restart.quiet-period=1s

