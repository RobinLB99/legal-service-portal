services:
  postgres:
    image: postgres:17-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "8080:8080"
      - "35729:35729" # Puerto para LiveReload
    volumes:
      # Monta el directorio completo del proyecto. Maven ahora ve todos los archivos.
      - .:/app
      # Cachea el repositorio de Maven para no descargar dependencias en cada inicio.
      - maven-repo:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:

volumes:
  postgres-data:
  # Volumen para persistir el repositorio de Maven.
  maven-repo:
